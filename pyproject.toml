[project]
name = "agnara-a8-mcp-service"
version = "0.1.0"
description = "Validation project for Agnara 0.1.0a8 MCP capabilities"
requires-python = ">=3.14"
dependencies = [
    "agnara==0.1.0a8",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
